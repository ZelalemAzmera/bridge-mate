server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (also help WCAG)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Charset for Ethiopic scripts
    charset utf-8;
    source_charset utf-8;

    # CORS for API proxy
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) { return 204; }
    }

    location /sms/ {
        proxy_pass http://api:3000/sms/;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api:3000/docs;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    # Direct content.json access
    location = /content.json {
        root /usr/share/nginx/html;
        try_files /content.json /data/content.json =404;
    }

    # Alias /savanna/ to web root so both /pages/... and /savanna/pages/... work
    location /savanna/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ =404;
    }

    # Static assets — long cache for versioned files
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JSON files — short cache
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ $uri.html /demo/blank.html;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;
}
